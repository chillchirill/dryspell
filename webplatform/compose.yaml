name: dryspell-platform
services:
  db:
    image: postgis/postgis:17-3.5@sha256:01a6a70e41e6c4467c8f55f6063555ed72db2d6662cd0d571040d42eadaeb6f6
    restart: unless-stopped
    environment:
      POSTGRES_USER: dryspell
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: dryspell
    ports:
      - "127.0.0.1:${DB_PORT:-55432}:5432"
    volumes:
      - dryspell-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dryspell -d dryspell"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 768m
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "work_mem=4MB", "-c", "max_connections=40"]
volumes:
  dryspell-db:
