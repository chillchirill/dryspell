# Optional TLS termination. Supply real certificate paths; do not expose credentials over public HTTP.
server {
  listen 443 ssl;
  server_name dryspell.example.org;
  ssl_certificate /etc/letsencrypt/live/dryspell.example.org/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/dryspell.example.org/privkey.pem;
  location / {
    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 90s;
  }
}
