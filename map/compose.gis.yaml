name: dryspell-map-gis
services:
  gis:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: dryspell_map
      POSTGRES_USER: dryspell_map
      POSTGRES_PASSWORD: ${MAP_DB_PASSWORD:-local-map-only}
    ports:
      - "127.0.0.1:${MAP_DB_PORT:-55435}:5432"
    volumes:
      - map-gis-data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-map.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dryspell_map -d dryspell_map"]
      interval: 5s
      timeout: 3s
      retries: 15
    mem_limit: 384m
    cpus: 1
volumes:
  map-gis-data:
